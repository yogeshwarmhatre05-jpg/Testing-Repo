<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Club Sidebar</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg-top:#3a1730;
  --bg-bottom:#5c1f2e;
  --panel:#0c0405;
  --panel-edge:#1a0708;
  --red:#c81e2c;
  --gold:#f4b400;
  --gold-glow:#ffd23f;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:32px 16px;
  background:
    radial-gradient(circle at 0% 0%, #7a3a4a 0%, transparent 40%),
    radial-gradient(circle at 100% 100%, #7a3a4a 0%, transparent 40%),
    linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
  font-family:'Oswald',sans-serif;
}

.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,var(--panel),var(--panel-edge));
  border-left:6px solid var(--red);
  box-shadow:0 0 24px rgba(200,30,44,.35), inset 0 0 60px rgba(0,0,0,.6);
  padding:36px 26px 30px;
}

.eyebrow{
  text-align:center;
  color:var(--gold);
  letter-spacing:6px;
  font-size:12px;
  font-weight:600;
  margin-bottom:10px;
}

.owner-name{
  text-align:center;
  font-family:'Great Vibes',cursive;
  font-size:46px;
  color:#fff;
  text-shadow:0 0 12px rgba(200,30,44,.8);
  margin-bottom:26px;
}

.club-name-box{
  border:1.5px solid var(--gold);
  box-shadow:0 0 10px rgba(244,180,0,.35);
  padding:26px 10px;
  text-align:center;
  margin-bottom:26px;
}

.club-name{
  font-family:'Great Vibes',cursive;
  font-size:58px;
  color:var(--gold);
  text-shadow:0 0 14px var(--gold-glow),0 0 28px rgba(244,180,0,.5);
}

hr{
  border:none;
  height:2px;
  background:var(--gold);
  box-shadow:0 0 8px rgba(244,180,0,.6);
  margin:24px 0;
}

.section-label{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.bar{
  width:4px;
  height:18px;
  background:var(--red);
  box-shadow:0 0 6px var(--red);
}

.section-label span:last-child{
  color:var(--gold);
  letter-spacing:3px;
  font-size:14px;
  font-weight:600;
}

.anthem-frame{
  border:1px solid #4a3030;
  padding:8px;
}

.anthem-frame a{
  display:block;
  position:relative;
}

.anthem-frame img{
  width:100%;
  display:block;
}

.play-badge{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  border:1px solid var(--gold);
}

.play-badge::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-40%,-50%);
  border-style:solid;
  border-width:9px 0 9px 15px;
  border-color:transparent transparent transparent var(--gold);
}

.links-list{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.links-list a{
  display:block;
  text-align:center;
  padding:16px;
  border:1.5px solid var(--gold);
  color:var(--gold);
  text-decoration:none;
  letter-spacing:2px;
  font-weight:600;
  background:linear-gradient(180deg,rgba(244,180,0,.06),transparent);
  transition:.2s;
}

.links-list a:hover{
  background:rgba(244,180,0,.14);
  box-shadow:0 0 10px rgba(244,180,0,.4);
}
</style>
</head>

<body>

<div class="card">

  <p class="eyebrow">OWNER</p>
  <p class="owner-name">Michael Kaiser</p>

  <div class="club-name-box">
    <p class="club-name">Synapse Bar</p>
  </div>

  <hr>

  <div class="section-label">
    <span class="bar"></span>
    <span>CLUB ANTHEM</span>
  </div>

  <div class="anthem-frame">
    <a href="https://youtu.be/kcsGhOmULxQ?si=B5-m_XajPkG8lCKI" target="_blank">
      <img src="https://img.youtube.com/vi/kcsGhOmULxQ/hqdefault.jpg" alt="Club Anthem">
      <span class="play-badge"></span>
    </a>
  </div>

  <hr>

  <div class="section-label">
    <span class="bar"></span>
    <span>LINKS</span>
  </div>

  <ul class="links-list">
    <li>
      <a href="https://www.chess.com/club/synapse-bar" target="_blank">
        CLUB PAGE
      </a>
    </li>

    <li>
      <a href="https://www.chess.com/clubs/events/synapse-bar" target="_blank">
        CLUB EVENTS
      </a>
    </li>

    <li>
      <a href="https://www.chess.com/club/synapse-bar/announcements" target="_blank">
        ANNOUNCEMENTS
      </a>
    </li>

    <li>
      <a href="https://www.chess.com/leaderboard/daily?group=920695" target="_blank">
        LEADERBOARD
      </a>
    </li>
  </ul>

</div>

</body>
</html>
