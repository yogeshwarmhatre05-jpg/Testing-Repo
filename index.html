<!DOCTYPE html>
<html>
<head>
<title>PixelGlow Recent Players</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}

.card{
    width:300px;
    margin:30px auto;
    padding:20px;
    border-radius:20px;
    background:#222;
}

.player{
    padding:10px;
    margin:8px;
    background:#333;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="card">
<h2>♟ Recent Players</h2>

<div id="players">
Loading...
</div>

</div>


<script>

let oldMembers = [];


async function loadPlayers(){

try{

let response = await fetch(
"https://api.chess.com/pub/club/pixelglow/members"
);


if(!response.ok){
throw new Error("API Error: " + response.status);
}


let data = await response.json();


// Get members
let members = [
    ...data.weekly,
    ...data.monthly,
    ...data.all_time
];


// Remove duplicates
members = [...new Set(members)];


// Detect new players
let newPlayers = members.filter(
player => !oldMembers.includes(player)
);


if(oldMembers.length > 0 && newPlayers.length > 0){
console.log("New players joined:", newPlayers);
}


oldMembers = members;


// Display players

document.getElementById("players").innerHTML =

members.slice(0,5).map(player =>

`
<div class="player">
♟ ${player}
</div>
`

).join("");


}

catch(error){

document.getElementById("players").innerHTML =
"Error loading players";

console.log(error);

}

}


loadPlayers();


// Refresh every 10 seconds
setInterval(loadPlayers,10000);


</script>


</body>
</html>
