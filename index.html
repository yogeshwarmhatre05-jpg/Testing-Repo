<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Haven — Club Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#F4EEE0;
    --washi-dim:#ECE4D2;
    --sumi:#1C1814;
    --sumi-soft:#2B241D;
    --hanko:#B8232C;
    --hanko-dark:#8C1B22;
    --stone:#8B8172;
    --hairline:#DCD2B8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  }
  body{background:var(--washi);font-family:'Zen Kaku Gothic New',sans-serif;color:var(--sumi);}

  .ah-widget{width:100%;max-width:340px;background:var(--washi);border:1px solid var(--hairline);margin:0 auto;}

  /* ---------- header (cover panel) ---------- */
  .ah-header{
    position:relative;background:var(--sumi);color:var(--washi);
    padding:24px 20px 20px;overflow:hidden;
  }
  .ah-header::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(244,238,224,.5) 1px, transparent 1.4px);
    background-size:9px 9px;opacity:.08;
  }
  .ah-header-row{position:relative;display:flex;align-items:center;gap:14px;}
  .ah-crest{width:54px;height:54px;border:2px solid var(--washi);object-fit:cover;flex-shrink:0;display:block;}
  .ah-crest-fallback{
    width:54px;height:54px;border:2px solid var(--washi);flex-shrink:0;display:none;
    align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;
    font-weight:800;font-size:18px;letter-spacing:.02em;
  }
  .ah-title-block{min-width:0;}
  .ah-title{font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;line-height:1.15;letter-spacing:.01em;}
  .ah-subtitle{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--washi);opacity:.6;margin-top:4px;}
  .ah-status{position:relative;margin-top:14px;display:inline-flex;align-items:center;gap:7px;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;}
  .ah-status-dot{width:6px;height:6px;border-radius:50%;background:var(--hanko);display:inline-block;
    box-shadow:0 0 0 3px rgba(184,35,44,.18);}

  /* ---------- owner strip w/ hanko seal ---------- */
  .ah-owner{display:flex;align-items:center;gap:13px;padding:15px 20px;border-bottom:1px solid var(--hairline);
    text-decoration:none;color:var(--sumi);transition:background-color .15s ease;}
  .ah-owner:hover{background:var(--washi-dim);}
  .ah-owner:hover .ah-seal{transform:rotate(-9deg) scale(1.05);}
  .ah-seal{
    position:relative;width:40px;height:40px;flex-shrink:0;background:var(--hanko);
    color:var(--washi);display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-weight:800;font-size:16px;
    clip-path:polygon(8% 2%,92% 0%,100% 12%,97% 90%,90% 100%,10% 98%,0% 88%,3% 10%);
    transform:rotate(-4deg);transition:transform .18s ease;
  }
  .ah-owner-text{min-width:0;}
  .ah-owner-role{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--hanko);display:block;}
  .ah-owner-name{font-weight:700;font-size:14px;margin-top:2px;}

  /* ---------- sections ---------- */
  .ah-section{padding:16px 20px 6px;}
  .ah-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;}

  /* search / jump */
  .ah-jump{position:relative;margin:0 20px 14px;}
  .ah-jump input{
    width:100%;padding:10px 12px;background:var(--washi-dim);border:1px solid var(--hairline);
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:var(--sumi);outline:none;
    transition:border-color .15s ease;
  }
  .ah-jump input::placeholder{color:var(--stone);}
  .ah-jump input:focus{border-color:var(--hanko);}

  /* tabs */
  .ah-tabs{display:flex;gap:2px;margin:0 20px 4px;border-bottom:1px solid var(--hairline);}
  .ah-tab{
    flex:1;background:none;border:none;cursor:pointer;padding:9px 4px 11px;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--stone);position:relative;transition:color .15s ease;
  }
  .ah-tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--hanko);
    transform:scaleX(0);transition:transform .18s ease;}
  .ah-tab[aria-selected="true"]{color:var(--sumi);font-weight:700;}
  .ah-tab[aria-selected="true"]::after{transform:scaleX(1);}
  .ah-tab:focus-visible{outline:2px solid var(--hanko);outline-offset:2px;}

  /* member rows */
  .ah-members{padding:6px 0 4px;}
  .ah-member{
    display:flex;align-items:center;gap:12px;padding:11px 20px;border-left:3px solid transparent;
    text-decoration:none;color:var(--sumi);transition:background-color .15s ease,border-color .15s ease,padding-left .15s ease;
  }
  .ah-member:hover{background:var(--washi-dim);border-left-color:var(--hanko);padding-left:23px;}
  .ah-member:focus-visible{outline:2px solid var(--hanko);outline-offset:-2px;}
  .ah-mnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--stone);width:22px;flex-shrink:0;}
  .ah-mavatar{width:32px;height:32px;object-fit:cover;background:var(--washi-dim);border:1px solid var(--hairline);flex-shrink:0;}
  .ah-mavatar-skel{width:32px;height:32px;flex-shrink:0;background:linear-gradient(90deg,var(--washi-dim) 25%,var(--hairline) 50%,var(--washi-dim) 75%);
    background-size:200% 100%;animation:ah-shimmer 1.3s ease-in-out infinite;}
  @keyframes ah-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .ah-mtext{min-width:0;flex:1;}
  .ah-mname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ah-mtime{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--stone);margin-top:2px;}
  .ah-empty{padding:22px 20px;text-align:center;font-size:12.5px;color:var(--stone);font-style:italic;}

  /* stats footer strip */
  .ah-stats{display:flex;border-top:1px solid var(--hairline);margin-top:8px;}
  .ah-stat{flex:1;padding:14px 20px;}
  .ah-stat + .ah-stat{border-left:1px solid var(--hairline);}
  .ah-stat-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);}
  .ah-stat-value{font-family:'Shippori Mincho',serif;font-weight:700;font-size:19px;margin-top:5px;color:var(--sumi);}

  /* links */
  .ah-links{padding:4px 0;border-top:1px solid var(--hairline);}
  .ah-link{display:flex;align-items:center;gap:14px;padding:13px 20px;text-decoration:none;color:var(--sumi);
    border-bottom:1px solid var(--hairline);transition:background-color .15s ease,color .15s ease,padding-left .15s ease;}
  .ah-link:last-child{border-bottom:none;}
  .ah-link:hover{background:var(--sumi);color:var(--washi);padding-left:24px;}
  .ah-link:hover .ah-coord{color:var(--hanko);}
  .ah-link:hover .ah-arrow{border-color:var(--washi);}
  .ah-link:focus-visible{outline:2px solid var(--hanko);outline-offset:-2px;}
  .ah-coord{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--stone);width:22px;flex-shrink:0;transition:color .15s ease;}
  .ah-link-label{font-weight:500;font-size:14px;flex:1;}
  .ah-arrow{width:7px;height:7px;border-top:1.5px solid var(--sumi);border-right:1.5px solid var(--sumi);transform:rotate(45deg);flex-shrink:0;transition:border-color .15s ease;}

  .ah-footer{padding:12px 20px;text-align:center;}
  .ah-footer-text{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);}
</style>
</head>
<body>

<div class="ah-widget">

  <div class="ah-header">
    <div class="ah-header-row">
      <img class="ah-crest" id="ahCrest" alt="Anime Haven crest"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="ah-crest-fallback" id="ahCrestFallback">AH</div>
      <div class="ah-title-block">
        <div class="ah-title">Anime Haven</div>
        <div class="ah-subtitle">Chess.com Club</div>
      </div>
    </div>
    <div class="ah-status">
      <span class="ah-status-dot"></span>
      <span id="ahStatusText">Loading dojo…</span>
    </div>
  </div>

  <a class="ah-owner" id="ahOwnerLink" href="https://www.chess.com/member/yogi136" target="_blank" rel="noopener">
    <div class="ah-seal" id="ahSeal">A</div>
    <div class="ah-owner-text">
      <span class="ah-owner-role">Founder's Seal</span>
      <div class="ah-owner-name" id="ahOwnerName">yogi136</div>
    </div>
  </a>

  <div class="ah-jump">
    <input type="text" id="ahFilter" placeholder="Find a member…" autocomplete="off">
  </div>

  <div class="ah-eyebrow"><span>New Recruits</span></div>
  <div class="ah-tabs" role="tablist">
    <button class="ah-tab" role="tab" data-tab="weekly" aria-selected="true">This Week</button>
    <button class="ah-tab" role="tab" data-tab="monthly" aria-selected="false">This Month</button>
    <button class="ah-tab" role="tab" data-tab="all_time" aria-selected="false">All-Time</button>
  </div>
  <div class="ah-members" id="ahMemberList"></div>

  <div class="ah-stats">
    <div class="ah-stat">
      <div class="ah-stat-label">Members</div>
      <div class="ah-stat-value" id="ahStatMembers">—</div>
    </div>
    <div class="ah-stat">
      <div class="ah-stat-label">Club Age</div>
      <div class="ah-stat-value" id="ahStatAge">—</div>
    </div>
  </div>

  <div class="ah-links">
    <a class="ah-link" id="ahLinkMatches" href="https://www.chess.com/clubs/matches/anime-haven" target="_blank" rel="noopener">
      <span class="ah-coord">A1</span><span class="ah-link-label">Matches</span><span class="ah-arrow"></span>
    </a>
    <a class="ah-link" id="ahLinkLeaderboard" href="https://www.chess.com/clubs/anime-haven" target="_blank" rel="noopener">
      <span class="ah-coord">B2</span><span class="ah-link-label">Leaderboard</span><span class="ah-arrow"></span>
    </a>
    <a class="ah-link" href="https://www.chess.com/clubs/events/anime-haven" target="_blank" rel="noopener">
      <span class="ah-coord">C3</span><span class="ah-link-label">Club Events</span><span class="ah-arrow"></span>
    </a>
    <a class="ah-link" href="https://www.chess.com/clubs/about/anime-haven" target="_blank" rel="noopener">
      <span class="ah-coord">D4</span><span class="ah-link-label">About</span><span class="ah-arrow"></span>
    </a>
  </div>

  <div class="ah-footer">
    <span class="ah-footer-text">Anime Haven · Founded &amp; sealed by yogi136</span>
  </div>

</div>

<script>
(function(){
  "use strict";

  var CONFIG = {
    clubSlug: "anime-haven",
    ownerUsername: "yogi136",
    useLiveApi: true,
    refreshMs: 5 * 60 * 1000,
    avatarConcurrency: 4
  };

  // fallback data — mirrors the club's members endpoint shape, used if live fetch fails
  var FALLBACK = {
    weekly: [
      { username: "yogi136", joined: 1777466298 }
    ],
    monthly: [
      { username: "cuberx2", joined: 1777230348 },
      { username: "delparco", joined: 1777809917 }
    ],
    all_time: [
      { username: "aryanakbar", joined: 1775484258 },
      { username: "charan_smaran", joined: 1777651198 },
      { username: "chess_sky_chrome", joined: 1779278570 },
      { username: "chientnhp", joined: 1780217252 },
      { username: "chiruuuuu_6", joined: 1777221111 },
      { username: "cleft_sovereign_chess", joined: 1777116059 },
      { username: "da_dumpster", joined: 1775409544 }
    ]
  };

  var state = {
    activeTab: "weekly",
    members: FALLBACK,
    avatars: {}, // username -> url | null (null = fetched, no avatar)
    filter: ""
  };

  var el = {
    crest: document.getElementById("ahCrest"),
    crestFallback: document.getElementById("ahCrestFallback"),
    statusText: document.getElementById("ahStatusText"),
    ownerLink: document.getElementById("ahOwnerLink"),
    ownerName: document.getElementById("ahOwnerName"),
    seal: document.getElementById("ahSeal"),
    filter: document.getElementById("ahFilter"),
    tabs: document.querySelectorAll(".ah-tab"),
    memberList: document.getElementById("ahMemberList"),
    statMembers: document.getElementById("ahStatMembers"),
    statAge: document.getElementById("ahStatAge"),
    linkLeaderboard: document.getElementById("ahLinkLeaderboard")
  };

  function timeAgo(unixSeconds){
    var diff = Math.max(0, Math.floor(Date.now() / 1000) - unixSeconds);
    var units = [
      [31536000, "y"], [2592000, "mo"], [604800, "w"], [86400, "d"], [3600, "h"], [60, "m"]
    ];
    for (var i = 0; i < units.length; i++){
      var v = Math.floor(diff / units[i][0]);
      if (v >= 1) return v + units[i][1] + " ago";
    }
    return "just now";
  }

  function clubAgeString(foundedUnix){
    var diff = Math.max(0, Math.floor(Date.now() / 1000) - foundedUnix);
    var years = Math.floor(diff / 31536000);
    var days = Math.floor((diff % 31536000) / 86400);
    if (years > 0) return years + "y " + days + "d";
    return days + "d";
  }

  function cacheBust(url){
    return url + (url.indexOf("?") === -1 ? "?" : "&") + "_ts=" + Date.now();
  }

  function renderMembers(){
    var list = state.members[state.activeTab] || [];
    var q = state.filter.trim().toLowerCase();
    if (q) list = list.filter(function(m){ return m.username.toLowerCase().indexOf(q) !== -1; });

    if (!list.length){
      el.memberList.innerHTML = '<div class="ah-empty">No members here yet.</div>';
      return;
    }

    var html = "";
    list.forEach(function(m, i){
      var num = String(i + 1).padStart(2, "0");
      var avatarUrl = state.avatars[m.username];
      var avatarHtml = avatarUrl
        ? '<img class="ah-mavatar" src="' + avatarUrl + '" alt="' + m.username + '" loading="lazy">'
        : (avatarUrl === null
            ? '<div class="ah-mavatar" style="display:flex;align-items:center;justify-content:center;font-family:\'Shippori Mincho\',serif;font-weight:700;font-size:13px;">' + m.username.charAt(0).toUpperCase() + '</div>'
            : '<div class="ah-mavatar-skel"></div>');
      html += '<a class="ah-member" href="https://www.chess.com/member/' + encodeURIComponent(m.username) + '" target="_blank" rel="noopener">' +
        '<span class="ah-mnum">№' + num + '</span>' +
        avatarHtml +
        '<div class="ah-mtext">' +
          '<div class="ah-mname">' + m.username + '</div>' +
          '<div class="ah-mtime">' + timeAgo(m.joined) + '</div>' +
        '</div>' +
      '</a>';
    });
    el.memberList.innerHTML = html;
    loadAvatarsFor(list);
  }

  var avatarQueue = [];
  var avatarInFlight = 0;

  function loadAvatarsFor(list){
    list.forEach(function(m){
      if (state.avatars.hasOwnProperty(m.username)) return;
      if (avatarQueue.indexOf(m.username) === -1) avatarQueue.push(m.username);
    });
    pumpAvatarQueue();
  }

  function pumpAvatarQueue(){
    while (avatarInFlight < CONFIG.avatarConcurrency && avatarQueue.length){
      var username = avatarQueue.shift();
      avatarInFlight++;
      fetch(cacheBust("https://api.chess.com/pub/player/" + encodeURIComponent(username)))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(data){
          state.avatars[username] = (data && data.avatar) ? data.avatar : null;
        })
        .catch(function(){
          state.avatars[username] = null;
        })
        .finally(function(){
          avatarInFlight--;
          renderMembers();
          pumpAvatarQueue();
        });
    }
  }

  function setTab(tab){
    state.activeTab = tab;
    el.tabs.forEach(function(btn){
      btn.setAttribute("aria-selected", btn.dataset.tab === tab ? "true" : "false");
    });
    renderMembers();
  }

  el.tabs.forEach(function(btn){
    btn.addEventListener("click", function(){ setTab(btn.dataset.tab); });
  });

  el.filter.addEventListener("input", function(){
    state.filter = el.filter.value;
    renderMembers();
  });

  el.seal.textContent = CONFIG.ownerUsername.charAt(0).toUpperCase();

  function applyProfile(profile){
    if (!profile) return;
    if (profile.icon) el.crest.src = profile.icon;
    else { el.crest.style.display = "none"; el.crestFallback.style.display = "flex"; }
    if (typeof profile.members_count === "number") el.statMembers.textContent = profile.members_count.toLocaleString();
    if (profile.created) el.statAge.textContent = clubAgeString(profile.created);
    el.statusText.textContent = "Active dojo";
    if (profile.club_id) {
      el.linkLeaderboard.href = "https://www.chess.com/leaderboard/live?group=" + profile.club_id;
    }
  }

  function applyOwnerAvatar(){
    fetch(cacheBust("https://api.chess.com/pub/player/" + encodeURIComponent(CONFIG.ownerUsername)))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if (data && data.name) el.ownerName.textContent = data.name + " (" + CONFIG.ownerUsername + ")";
      })
      .catch(function(){});
  }

  function fetchAll(){
    if (!CONFIG.useLiveApi){
      renderMembers();
      el.statusText.textContent = "Active dojo";
      return;
    }
    Promise.all([
      fetch(cacheBust("https://api.chess.com/pub/club/" + CONFIG.clubSlug), { cache: "no-store" })
        .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
      fetch(cacheBust("https://api.chess.com/pub/club/" + CONFIG.clubSlug + "/members"), { cache: "no-store" })
        .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
    ]).then(function(results){
      var profile = results[0];
      var members = results[1];
      applyProfile(profile);
      if (members && (members.weekly || members.monthly || members.all_time)){
        state.members = {
          weekly: members.weekly || [],
          monthly: members.monthly || [],
          all_time: members.all_time || []
        };
      }
      renderMembers();
    }).catch(function(){
      el.statusText.textContent = "Active dojo";
      renderMembers();
    });
  }

  function scheduleRefresh(){
    setTimeout(function(){
      fetchAll();
      scheduleRefresh();
    }, CONFIG.refreshMs);
  }

  renderMembers();
  fetchAll();
  applyOwnerAvatar();
  scheduleRefresh();
})();
</script>
</body>
</html>
