<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse Bar — Club Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAF8;
    --paper-dim: #F1F0EC;
    --ink: #111111;
    --steel: #7A7A74;
    --hairline: #DEDDD6;
    --crimson: #C41E2F;
    --crimson-dark: #9A1522;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  body {
    background: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
  }

  .sb-widget {
    width: 100%;
    max-width: 340px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  .sb-header {
    position: relative;
    background: var(--ink);
    color: var(--paper);
    padding: 22px 20px 18px;
    overflow: hidden;
  }

  .sb-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--hairline) 1px, transparent 1px),
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size: 14px 14px;
    opacity: 0.06;
    pointer-events: none;
  }

  .sb-header-top {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .sb-crest {
    width: 52px;
    height: 52px;
    border: 2px solid var(--paper);
    flex-shrink: 0;
    display: block;
    object-fit: cover;
  }

  .sb-crest-fallback {
    width: 52px;
    height: 52px;
    border: 2px solid var(--paper);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .sb-name-block { min-width: 0; }

  .sb-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    line-height: 1.1;
  }

  .sb-status {
    position: relative;
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--paper);
    opacity: 0.85;
  }

  .sb-status-dot {
    width: 6px;
    height: 6px;
    background: var(--crimson);
    display: inline-block;
  }

  /* ---------- Owner strip ---------- */
  .sb-owner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
    text-decoration: none;
    color: var(--ink);
    transition: background-color 0.15s ease;
  }

  .sb-owner:hover { background: var(--paper-dim); }

  .sb-owner-avatar {
    width: 36px;
    height: 36px;
    border: 1px solid var(--hairline);
    flex-shrink: 0;
    object-fit: cover;
  }

  .sb-owner-text { min-width: 0; }

  .sb-owner-role {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--crimson);
    display: block;
  }

  .sb-owner-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    margin-top: 2px;
  }

  /* ---------- Anthem ---------- */
  .sb-section {
    padding: 16px 20px 18px;
    border-bottom: 1px solid var(--hairline);
  }

  .sb-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 10px;
  }

  .sb-anthem {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--ink);
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--hairline);
  }

  .sb-anthem img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0.75;
    transition: opacity 0.2s ease;
  }

  .sb-anthem:hover img { opacity: 0.55; }

  .sb-anthem iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .sb-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    background: var(--crimson);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }

  .sb-anthem:hover .sb-play {
    background: var(--crimson-dark);
    transform: translate(-50%, -50%) scale(1.05);
  }

  .sb-play svg { width: 16px; height: 16px; fill: var(--paper); margin-left: 2px; }

  /* ---------- Links ---------- */
  .sb-links { padding: 4px 0; }

  .sb-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 20px;
    text-decoration: none;
    color: var(--ink);
    border-bottom: 1px solid var(--hairline);
    transition: background-color 0.15s ease, padding-left 0.15s ease;
  }

  .sb-link:last-child { border-bottom: none; }

  .sb-link:hover {
    background: var(--ink);
    color: var(--paper);
    padding-left: 24px;
  }

  .sb-link:hover .sb-coord { color: var(--crimson); }
  .sb-link:hover .sb-arrow { border-color: var(--paper); }
  .sb-link:hover .sb-arrow::after { border-color: var(--paper); }

  .sb-coord {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--steel);
    width: 22px;
    flex-shrink: 0;
    transition: color 0.15s ease;
  }

  .sb-link-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 14px;
    flex: 1;
  }

  .sb-arrow {
    width: 7px;
    height: 7px;
    border-top: 1.5px solid var(--ink);
    border-right: 1.5px solid var(--ink);
    transform: rotate(45deg);
    flex-shrink: 0;
    transition: border-color 0.15s ease;
  }

  /* ---------- Footer ---------- */
  .sb-footer {
    padding: 12px 20px;
    text-align: center;
  }

  .sb-footer-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--steel);
  }
</style>
</head>
<body>

<div class="sb-widget">

  <!-- Header -->
  <div class="sb-header">
    <div class="sb-header-top">
      <img
        class="sb-crest"
        src="https://images.chesscomfiles.com/uploads/v1/group/920695.53fb7120.160x160o.514f0aa05831.jpg"
        alt="Synapse Bar crest"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      >
      <div class="sb-crest-fallback" style="display:none;">SB</div>
      <div class="sb-name-block">
        <div class="sb-name">Synapse Bar</div>
      </div>
    </div>
    <div class="sb-status">
      <span class="sb-status-dot"></span>
      Status: Active
    </div>
  </div>

  <!-- Owner -->
  <a class="sb-owner" href="https://www.chess.com/member/michael-kaiser10bm" target="_blank" rel="noopener">
    <img class="sb-owner-avatar" src="https://images.chesscomfiles.com/uploads/v1/user/303824883.0513c743.48x48o.b1f8c089f3d3.jpg" alt="Michael Kaiser">
    <div class="sb-owner-text">
      <span class="sb-owner-role">Chief Tactician</span>
      <div class="sb-owner-name">Michael Kaiser</div>
    </div>
  </a>

  <!-- Anthem -->
  <div class="sb-section">
    <div class="sb-eyebrow">Club Anthem</div>
    <div class="sb-anthem" id="sbAnthem" onclick="sbPlayAnthem()">
      <img src="https://img.youtube.com/vi/kcsGhOmULxQ/hqdefault.jpg" alt="Club anthem thumbnail" loading="lazy">
      <div class="sb-play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
  </div>
  <!-- Links -->
  <div class="sb-links">
    <a class="sb-link" href="https://www.chess.com/leaderboard/daily?group=920695" target="_blank" rel="noopener">
      <span class="sb-coord">D4</span>
      <span class="sb-link-label">Leaderboard</span>
      <span class="sb-arrow"></span>
    </a>
    <a class="sb-link" href="https://www.chess.com/clubs/events/synapse-bar" target="_blank" rel="noopener">
      <span class="sb-coord">E5</span>
      <span class="sb-link-label">Club Events</span>
      <span class="sb-arrow"></span>
    </a>
    <a class="sb-link" href="https://www.chess.com/clubs/about/synapse-bar" target="_blank" rel="noopener">
      <span class="sb-coord">C3</span>
      <span class="sb-link-label">About</span>
      <span class="sb-arrow"></span>
    </a>
  </div>

  <div class="sb-footer">
    <span class="sb-footer-text">Synapse Bar · Est. 2026</span>
  </div>

</div>

<script>
  function sbPlayAnthem() {
    var container = document.getElementById('sbAnthem');
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/kcsGhOmULxQ?autoplay=1&rel=0';
    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
    iframe.setAttribute('allowfullscreen', '');
    container.innerHTML = '';
    container.appendChild(iframe);
    container.onclick = null;
  }
</script>
</body>
</html>
