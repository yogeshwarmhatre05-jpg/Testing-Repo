<!DOCTYPE html>
<html>
<head>
<title>PixelGlow Players</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}

.card{
    width:300px;
    margin:30px auto;
    padding:20px;
    background:#222;
    border-radius:20px;
}

.player{
    background:#333;
    margin:8px;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="card">
<h2>♟ PixelGlow Players</h2>
<div id="players">Loading...</div>
</div>


<script>

async function loadPlayers(){

try{

let url="https://api.chess.com/pub/club/pixelglow/members";

let response = await fetch(url);

console.log("Status:", response.status);

if(!response.ok){
throw new Error("HTTP Error: "+response.status);
}

let data = await response.json();

console.log(data);


let members=[
...data.weekly,
...data.monthly,
...data.all_time
];


document.getElementById("players").innerHTML =
members.slice(0,10).map(player=>`
<div class="player">
♟ ${typeof player === "string" ? player : player.username}
</div>
`).join("");

}

catch(error){

document.getElementById("players").innerHTML =
"Error: "+error.message;

console.log(error);

}

}


loadPlayers();

</script>

</body>
</html>
