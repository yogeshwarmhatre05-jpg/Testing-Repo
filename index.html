<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocking Superstar Team — Club Sidebar</title>

<!-- ============================================================
     Google Fonts: Cinzel (display/royal), Cormorant Garamond
     (accent/quotes), Inter (body/data)
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;0,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   0. DESIGN TOKENS
============================================================ */
:root{
  --navy-deep:      #0a1630;
  --navy:            #0f1f45;
  --navy-mid:        #16295e;
  --navy-light:      #1f3572;
  --gold:            #c9a24a;
  --gold-bright:     #e6c876;
  --gold-dim:        #8a743a;
  --cream:           #f2ede1;
  --cream-dim:       #c7c2b6;
  --ink-muted:       #9aa4c4;
  --card-bg:         #122script;
  --radius-sm:       8px;
  --radius-md:       12px;
  --radius-lg:       16px;
  --shadow-soft:     0 4px 14px rgba(0,0,0,0.28);
  --font-display:    'Cinzel', serif;
  --font-accent:     'Cormorant Garamond', serif;
  --font-body:       'Inter', sans-serif;
}

/* ============================================================
   1. RESET & BASE
============================================================ */
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  font-family:var(--font-body);
  background:
    radial-gradient(ellipse at top, #142a5e 0%, var(--navy) 46%, var(--navy-deep) 100%);
  color:var(--cream);
  display:flex;
  justify-content:center;
  padding:14px 10px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

/* ============================================================
   2. SIDEBAR SHELL
============================================================ */
.sidebar{
  width:100%;
  max-width:325px;
  position:relative;
  background:
    repeating-linear-gradient(45deg, rgba(201,162,74,0.035) 0 2px, transparent 2px 34px),
    repeating-linear-gradient(-45deg, rgba(201,162,74,0.035) 0 2px, transparent 2px 34px),
    linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  border:1px solid rgba(201,162,74,0.35);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,0.45);
}

/* faint corner ornaments */
.corner-ornament{
  position:absolute;
  width:46px; height:46px;
  opacity:0.55;
  pointer-events:none;
  z-index:2;
}
.corner-ornament svg{ width:100%; height:100%; }
.corner-tl{ top:8px; left:8px; }
.corner-tr{ top:8px; right:8px; transform:scaleX(-1); }
.corner-bl{ bottom:8px; left:8px; transform:scaleY(-1); }
.corner-br{ bottom:8px; right:8px; transform:scale(-1,-1); }

.section{
  padding:18px 16px;
  position:relative;
  animation:fadeIn 0.5s ease both;
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

.divider{
  border:none;
  height:1px;
  margin:0 16px;
  background:linear-gradient(90deg, transparent, var(--gold-dim) 18%, var(--gold) 50%, var(--gold-dim) 82%, transparent);
  opacity:0.6;
}

.eyebrow{
  font-family:var(--font-display);
  font-size:10.5px;
  letter-spacing:2.2px;
  text-transform:uppercase;
  color:var(--gold-bright);
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:12px;
}
.eyebrow .icon{ width:14px; height:14px; flex-shrink:0; }
.eyebrow::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(90deg, var(--gold-dim), transparent);
}

/* generic icon sizing */
.icon{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.6; }

/* ============================================================
   3. CLUB HEADER
============================================================ */
.club-header{
  padding:26px 18px 20px;
  text-align:center;
  position:relative;
}
.club-header .chessboard-glow{
  position:absolute; inset:0;
  background:
    repeating-conic-gradient(rgba(201,162,74,0.05) 0% 25%, transparent 0% 50%) 0 0/26px 26px;
  mask-image:linear-gradient(180deg, black, transparent 90%);
  pointer-events:none;
}
.club-logo{
  width:64px; height:64px;
  border-radius:50%;
  margin:0 auto 12px;
  border:2px solid var(--gold);
  box-shadow:0 0 0 4px rgba(201,162,74,0.12), var(--shadow-soft);
  object-fit:cover;
  background:var(--navy-mid);
}
.club-name{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:600;
  letter-spacing:0.5px;
  color:var(--cream);
  line-height:1.3;
}
.club-subtitle{
  font-family:var(--font-accent);
  font-style:italic;
  font-size:14px;
  color:var(--gold-bright);
  margin-top:4px;
  letter-spacing:0.3px;
}

/* ============================================================
   4. CLUB OWNER
============================================================ */
.owner-card{
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(155deg, var(--navy-mid), var(--navy));
  border:1px solid rgba(201,162,74,0.28);
  border-radius:var(--radius-md);
  padding:12px 14px;
  box-shadow:var(--shadow-soft);
}
.owner-avatar{
  width:52px; height:52px;
  border-radius:50%;
  border:2px solid var(--gold);
  object-fit:cover;
  flex-shrink:0;
  background:var(--navy-light);
}
.owner-info{ flex:1; min-width:0; }
.owner-name{
  font-family:var(--font-display);
  font-size:14.5px;
  font-weight:600;
  color:var(--cream);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.owner-role{
  font-size:11px;
  color:var(--ink-muted);
  margin-top:1px;
}
.owner-link{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:6px;
  font-size:11.5px;
  font-weight:600;
  color:var(--gold-bright);
  border-bottom:1px solid rgba(230,200,118,0.4);
  padding-bottom:1px;
  transition:opacity 0.15s ease;
}
.owner-link:hover{ opacity:0.75; }

/* ============================================================
   5. STAT CARDS
============================================================ */
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.stat-card{
  grid-column:span 1;
  background:linear-gradient(160deg, var(--navy-mid), var(--navy));
  border:1px solid rgba(201,162,74,0.25);
  border-radius:var(--radius-md);
  padding:12px 10px;
  text-align:center;
  box-shadow:var(--shadow-soft);
}
.stat-card.full{ grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; text-align:left; padding:12px 14px; }
.stat-icon{
  width:18px; height:18px;
  color:var(--gold-bright);
  margin:0 auto 6px;
}
.stat-card.full .stat-icon{ margin:0; }
.stat-value{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:700;
  color:var(--cream);
  line-height:1;
}
.stat-label{
  font-size:10px;
  letter-spacing:0.6px;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin-top:5px;
}
.stat-card.full .stat-value, .stat-card.full .stat-label{ margin-top:0; }
.stat-card.full .stat-text{ flex:1; margin-left:10px; }
.stat-card.full .stat-user{ font-size:12.5px; color:var(--gold-bright); font-weight:600; }

/* ============================================================
   6. FEATURED VIDEO + QUOTE
============================================================ */
.video-frame{
  position:relative;
  width:100%;
  padding-top:56.25%;
  border-radius:var(--radius-md);
  overflow:hidden;
  border:1px solid rgba(201,162,74,0.3);
  box-shadow:var(--shadow-soft);
}
.video-frame iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0;
}
.quote-card{
  margin-top:12px;
  background:linear-gradient(160deg, var(--navy-mid), var(--navy));
  border-left:2px solid var(--gold);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  padding:12px 14px;
}
.quote-text{
  font-family:var(--font-accent);
  font-style:italic;
  font-size:14.5px;
  line-height:1.45;
  color:var(--cream);
}
.quote-author{
  margin-top:6px;
  font-size:10.5px;
  letter-spacing:0.8px;
  text-transform:uppercase;
  color:var(--gold-bright);
}

/* ============================================================
   7. ACTION BUTTONS
============================================================ */
.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.action-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:13px 8px;
  background:linear-gradient(160deg, var(--navy-mid), var(--navy-deep));
  border:1px solid var(--gold-dim);
  border-radius:var(--radius-md);
  color:var(--cream);
  font-size:12px;
  font-weight:600;
  letter-spacing:0.3px;
  transition:transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.action-btn .icon{ width:19px; height:19px; color:var(--gold-bright); }
.action-btn:hover{
  transform:translateY(-2px);
  border-color:var(--gold);
  box-shadow:0 6px 16px rgba(0,0,0,0.35);
}

/* ============================================================
   8. CLUB ANTHEM AUDIO PLAYER
============================================================ */
.anthem-player{
  background:linear-gradient(160deg, var(--navy-mid), var(--navy));
  border:1px solid rgba(201,162,74,0.28);
  border-radius:var(--radius-md);
  padding:13px 14px;
  box-shadow:var(--shadow-soft);
}
.anthem-top{
  display:flex;
  align-items:center;
  gap:10px;
}
.anthem-toggle{
  width:36px; height:36px;
  border-radius:50%;
  background:var(--gold);
  color:var(--navy-deep);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  transition:transform 0.15s ease;
}
.anthem-toggle:hover{ transform:scale(1.06); }
.anthem-toggle .icon{ width:15px; height:15px; stroke:none; fill:currentColor; }
.anthem-meta{ flex:1; min-width:0; }
.anthem-title{ font-size:12.5px; font-weight:600; color:var(--cream); }
.anthem-sub{ font-size:10.5px; color:var(--ink-muted); margin-top:1px; }
.anthem-progress-row{
  display:flex; align-items:center; gap:8px;
  margin-top:11px;
  font-size:10px; color:var(--ink-muted);
}
.progress-track{
  flex:1; height:4px; border-radius:2px;
  background:rgba(255,255,255,0.12);
  position:relative; cursor:pointer;
}
.progress-fill{
  position:absolute; left:0; top:0; height:100%;
  width:0%; border-radius:2px;
  background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
}
.anthem-volume-row{
  display:flex; align-items:center; gap:8px;
  margin-top:9px;
}
.anthem-volume-row .icon{ width:14px; height:14px; color:var(--gold-bright); }
input[type="range"]{
  -webkit-appearance:none;
  appearance:none;
  width:100%; height:4px;
  border-radius:2px;
  background:rgba(255,255,255,0.12);
  outline:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:11px; height:11px;
  border-radius:50%;
  background:var(--gold-bright);
  cursor:pointer;
  border:2px solid var(--navy-deep);
}
input[type="range"]::-moz-range-thumb{
  width:11px; height:11px; border-radius:50%;
  background:var(--gold-bright); border:2px solid var(--navy-deep); cursor:pointer;
}

/* ============================================================
   9. MEMBER LISTS (Newest / Highest rated)
============================================================ */
.member-list{
  display:flex;
  flex-direction:column;
  gap:7px;
  max-height:290px;
  overflow-y:auto;
  padding-right:2px;
}
.member-list::-webkit-scrollbar{ width:4px; }
.member-list::-webkit-scrollbar-thumb{ background:var(--gold-dim); border-radius:2px; }

.member-row{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(201,162,74,0.14);
  border-radius:var(--radius-sm);
  padding:8px 10px;
}
.member-rank{
  width:18px; text-align:center;
  font-family:var(--font-display);
  font-size:11px; font-weight:700;
  color:var(--gold-bright);
  flex-shrink:0;
}
.member-avatar{
  width:32px; height:32px;
  border-radius:50%;
  object-fit:cover;
  border:1.5px solid rgba(201,162,74,0.5);
  flex-shrink:0;
  background:var(--navy-light);
}
.member-info{ flex:1; min-width:0; }
.member-name{
  font-size:12.5px; font-weight:600; color:var(--cream);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.member-sub{ font-size:10px; color:var(--ink-muted); margin-top:1px; }
.member-badge{
  font-size:10px; font-weight:700;
  color:var(--navy-deep);
  background:linear-gradient(160deg, var(--gold-bright), var(--gold));
  padding:2px 7px;
  border-radius:20px;
  flex-shrink:0;
}
.member-rating{
  font-family:var(--font-display);
  font-size:12.5px; font-weight:700;
  color:var(--gold-bright);
  flex-shrink:0;
}
.list-skeleton{ font-size:11.5px; color:var(--ink-muted); padding:8px 2px; }

/* ============================================================
   10. CALENDAR
============================================================ */
.calendar-card{
  background:linear-gradient(160deg, var(--navy-mid), var(--navy));
  border:1px solid rgba(201,162,74,0.28);
  border-radius:var(--radius-md);
  padding:13px 14px;
  box-shadow:var(--shadow-soft);
}
.calendar-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px;
}
.calendar-title{
  font-family:var(--font-display);
  font-size:13px; font-weight:600;
  color:var(--cream);
  letter-spacing:0.5px;
}
.calendar-nav{ display:flex; gap:6px; }
.calendar-nav button{
  width:24px; height:24px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--gold-dim);
  border-radius:6px;
  color:var(--gold-bright);
  transition:background 0.15s ease;
}
.calendar-nav button:hover{ background:rgba(201,162,74,0.12); }
.calendar-nav .icon{ width:12px; height:12px; }
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:3px;
  text-align:center;
}
.calendar-grid .dow{
  font-size:9px; font-weight:600; letter-spacing:0.4px;
  color:var(--gold-dim);
  padding-bottom:4px;
}
.calendar-grid .day{
  font-size:11px;
  color:var(--cream-dim);
  padding:5px 0;
  border-radius:6px;
}
.calendar-grid .day.muted{ color:rgba(199,194,182,0.25); }
.calendar-grid .day.today{
  background:linear-gradient(160deg, var(--gold-bright), var(--gold));
  color:var(--navy-deep);
  font-weight:700;
}

/* ============================================================
   11. PARTNERED CLUBS
============================================================ */
.partner-list{ display:flex; flex-direction:column; gap:8px; }
.partner-card{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(201,162,74,0.16);
  border-radius:var(--radius-sm);
  padding:9px 10px;
}
.partner-logo{
  width:34px; height:34px; border-radius:8px;
  object-fit:cover; flex-shrink:0;
  border:1px solid rgba(201,162,74,0.3);
  background:var(--navy-light);
}
.partner-name{ flex:1; font-size:12px; font-weight:600; color:var(--cream); min-width:0; }
.partner-visit{
  font-size:10.5px; font-weight:700;
  color:var(--navy-deep);
  background:var(--gold-bright);
  padding:5px 10px;
  border-radius:20px;
  flex-shrink:0;
  transition:opacity 0.15s ease;
}
.partner-visit:hover{ opacity:0.85; }

/* ============================================================
   12. FOOTER
============================================================ */
.sidebar-footer{
  text-align:center;
  padding:16px 16px 22px;
  font-size:10px;
  color:var(--ink-muted);
  letter-spacing:0.4px;
}
.sidebar-footer .gold{ color:var(--gold-bright); }

/* ============================================================
   13. RESPONSIVE
============================================================ */
@media (max-width:360px){
  .sidebar{ max-width:100%; }
  body{ padding:10px 6px; }
}
</style>
</head>
<body>

<!-- ==================================================================
     SIDEBAR
================================================================== -->
<aside class="sidebar" id="sidebar">

  <!-- corner ornaments (thin gold laurel-corner line art) -->
  <div class="corner-ornament corner-tl">
    <svg viewBox="0 0 48 48"><path d="M4 44 Q4 14 34 6" stroke="#c9a24a" stroke-width="1.1" fill="none"/><path d="M4 44 Q10 30 4 18" stroke="#c9a24a" stroke-width="1" fill="none"/><circle cx="34" cy="6" r="2" fill="#c9a24a"/></svg>
  </div>
  <div class="corner-ornament corner-tr">
    <svg viewBox="0 0 48 48"><path d="M4 44 Q4 14 34 6" stroke="#c9a24a" stroke-width="1.1" fill="none"/><path d="M4 44 Q10 30 4 18" stroke="#c9a24a" stroke-width="1" fill="none"/><circle cx="34" cy="6" r="2" fill="#c9a24a"/></svg>
  </div>

  <!-- ============================== 1. CLUB HEADER ============================== -->
  <section class="section club-header" aria-label="Club header">
    <div class="chessboard-glow"></div>
    <img class="club-logo" id="clubLogo" src="" alt="Club logo" loading="lazy">
    <h1 class="club-name" id="clubName">Loading club…</h1>
    <p class="club-subtitle" id="clubSubtitle">A Sanctuary for Royal Play</p>
  </section>

  <hr class="divider">

  <!-- ============================== 2. CLUB OWNER ============================== -->
  <section class="section" aria-label="Club owner">
    <p class="eyebrow"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20c1-8 4-11 8-11s7 3 8 11" stroke-linecap="round"/><path d="M6 9 3 5l4 1 2-3 3 3.5L15.5 3l2 3 4-1-3 4" stroke-linecap="round" stroke-linejoin="round"/></svg>Club Owner</p>
    <div class="owner-card">
      <img class="owner-avatar" id="ownerAvatar" src="" alt="Owner avatar" loading="lazy">
      <div class="owner-info">
        <div class="owner-name" id="ownerName">Loading…</div>
        <div class="owner-role">Founder &amp; Administrator</div>
        <a class="owner-link" id="ownerLink" href="#" target="_blank" rel="noopener">
          View profile
          <svg class="icon" style="width:11px;height:11px;stroke-width:2" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </div>
  </section>

  <hr class="divider">

  <!-- ============================== 3. CLUB STATISTICS ============================== -->
  <section class="section" aria-label="Club statistics">
    <p class="eyebrow"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round"/></svg>Club Statistics</p>
    <div class="stats-grid">
      <div class="stat-card">
        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 20v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="stat-value" id="statMembers">—</div>
        <div class="stat-label">Current Members</div>
      </div>
      <div class="stat-card">
        <svg class="stat-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
        <div class="stat-value" id="statGoal">—</div>
        <div class="stat-label">Member Goal</div>
      </div>
      <div class="stat-card full">
        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M4 20 20 4M4 4l16 16" stroke-linecap="round" style="display:none"/><path d="M12 2 4 7v5c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V7l-8-5Z" stroke-linejoin="round"/></svg>
        <div class="stat-text">
          <div class="stat-user" id="statTopUser">—</div>
          <div class="stat-label" style="margin-top:2px;">Highest Rated Player</d
