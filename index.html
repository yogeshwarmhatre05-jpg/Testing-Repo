<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rocking Superstar Team</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B0A10;
    padding: 24px;
    font-family: 'Inter', sans-serif;
  }
  .rst-scroll::-webkit-scrollbar { width: 4px; }
  .rst-scroll::-webkit-scrollbar-thumb { background: rgba(232,181,77,0.4); border-radius: 4px; }
  @keyframes rst-pulse {
    0%, 100% { opacity: 0.55; transform: scaleY(0.4); }
    50% { opacity: 1; transform: scaleY(1); }
  }
  .rst-bar { animation: rst-pulse 1.1s ease-in-out infinite; transform-origin: bottom; }
  .rst-spin { animation: rst-spin 0.8s linear infinite; }
  @keyframes rst-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const {
  Crown, Play, Pause, Volume2, Trophy, CalendarDays,
  Send, CheckCircle2, Sparkles, Inbox, ChevronDown, Loader2, AlertCircle,
} = lucideReact;

// ---- Swap this array with your API response later. ----
// Expected shape per member: { id, name, rating, joinedDaysAgo }
const MOCK_RECENT_MEMBERS = [
  { id: 1, name: "Ishaan Verma", rating: 1842, joinedDaysAgo: 1 },
  { id: 2, name: "Meera Kapoor", rating: 1765, joinedDaysAgo: 3 },
  { id: 3, name: "Aarav Sinha", rating: 1601, joinedDaysAgo: 6 },
];

const ANTHEM_LINES = [
  "We push the pawns, we hold the line,",
  "eight by eight, the board's our shrine.",
  "Rock the clock, don't blink, don't bend —",
  "Rocking Superstars, checkmate's our friend.",
];

const CHESS_QUOTE = {
  text: "Every chess master was once a beginner.",
  author: "Irving Chernev",
};

// ---- Storage: plain localStorage, works on any static host (GitHub Pages included) ----
const STORAGE_PREFIX = "rst_reports:";

function saveReport(entry) {
  const key = STORAGE_PREFIX + entry.timestamp;
  localStorage.setItem(key, JSON.stringify(entry));
}

function loadAllReports() {
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(STORAGE_PREFIX)) {
      try {
        const val = JSON.parse(localStorage.getItem(key));
        if (val) items.push(val);
      } catch (_) {}
    }
  }
  items.sort((a, b) => b.timestamp - a.timestamp);
  return items;
}

function RankBadge({ rank }) {
  const styles = {
    1: { bg: "#E8B54D", fg: "#1A1420" },
    2: { bg: "#CBD1DC", fg: "#1A1420" },
    3: { bg: "#C98A52", fg: "#1A1420" },
  };
  const s = styles[rank];
  return (
    <span style={{
      display: "flex", alignItems: "center", justifyContent: "center",
      borderRadius: "9999px", fontWeight: 700, flexShrink: 0,
      width: 24, height: 24, fontSize: 12, background: s.bg, color: s.fg,
      fontFamily: "'JetBrains Mono', monospace",
    }}>
      {rank}
    </span>
  );
}

function RockingSuperstarSidebar() {
  const [isPlaying, setIsPlaying] = useState(false);
  const [progress, setProgress] = useState(18);
  const intervalRef = useRef(null);

  const [report, setReport] = useState("");
  const [sent, setSent] = useState(false);
  const [sendError, setSendError] = useState(false);

  const [showReports, setShowReports] = useState(false);
  const [reports, setReports] = useState([]);
  const [loadingReports, setLoadingReports] = useState(false);
  const [loadError, setLoadError] = useState(false);

  useEffect(() => {
    if (isPlaying) {
      intervalRef.current = setInterval(() => {
        setProgress((p) => (p >= 100 ? 0 : p + 1));
      }, 450);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [isPlaying]);

  const totalSeconds = 154;
  const currentSeconds = Math.floor((progress / 100) * totalSeconds);
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const activeLineIndex = Math.min(
    ANTHEM_LINES.length - 1,
    Math.floor((progress / 100) * ANTHEM_LINES.length)
  );

  const handleReportSubmit = () => {
    if (!report.trim()) return;
    const entry = { text: report.trim(), timestamp: Date.now() };
    try {
      saveReport(entry);
      setSent(true);
      setSendError(false);
      setReport("");
      if (showReports) setReports((prev) => [entry, ...prev]);
      setTimeout(() => setSent(false), 2600);
    } catch (err) {
      console.error("Failed to save report:", err);
      setSendError(true);
      setTimeout(() => setSendError(false), 3000);
    }
  };

  const loadReports = () => {
    setLoadingReports(true);
    setLoadError(false);
    try {
      const items = loadAllReports();
      setReports(items);
    } catch (err) {
      console.error("Failed to load reports:", err);
      setLoadError(true);
    } finally {
      setLoadingReports(false);
    }
  };

  const toggleReports = () => {
    const next = !showReports;
    setShowReports(next);
    if (next) loadReports();
  };

  const formatTimestamp = (ts) => {
    const d = new Date(ts);
    return d.toLocaleString(undefined, {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  };

  return (
    <div style={{
      width: "100%", maxWidth: 320, margin: "0 auto", display: "flex", flexDirection: "column",
      fontFamily: "'Inter', sans-serif", background: "#151320", color: "#F3EFE6",
      borderRadius: 20, overflow: "hidden", border: "1px solid rgba(255,255,255,0.08)",
      boxShadow: "0 30px 60px -20px rgba(0,0,0,0.6)",
    }}>
      {/* Header */}
      <div style={{
        position: "relative", padding: "24px 20px 20px",
        background: "radial-gradient(120% 140% at 15% 0%, rgba(214,69,95,0.35) 0%, rgba(21,19,32,0) 55%), linear-gradient(180deg, #1E1B2C 0%, #151320 100%)",
        borderBottom: "1px solid rgba(255,255,255,0.07)",
      }}>
        <div style={{
          position: "absolute", inset: 0, opacity: 0.06, pointerEvents: "none",
          backgroundImage: "repeating-conic-gradient(#F3EFE6 0% 25%, transparent 0% 50%)",
          backgroundSize: "16px 16px",
        }} />
        <div style={{ position: "relative", display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 12,
            flexShrink: 0, width: 46, height: 46,
            background: "linear-gradient(145deg, #E8B54D, #C98A3A)",
            boxShadow: "0 6px 18px -4px rgba(232,181,77,0.55)",
          }}>
            <Crown size={24} color="#1A1420" strokeWidth={2.4} />
          </div>
          <div>
            <p style={{ lineHeight: 1, margin: 0, fontFamily: "'Bebas Neue', sans-serif", fontSize: 26, letterSpacing: "0.03em" }}>
              ROCKING SUPERSTAR
            </p>
            <p style={{ lineHeight: 1, margin: "4px 0 0", fontFamily: "'Bebas Neue', sans-serif", fontSize: 15, letterSpacing: "0.3em", color: "#E8B54D" }}>
              TEAM
            </p>
          </div>
        </div>
        <div style={{ position: "relative", display: "flex", alignItems: "center", gap: 6, marginTop: 12 }}>
          <Sparkles size={12} color="#D6455F" />
          <span style={{ fontSize: 11, color: "#948FA3", letterSpacing: "0.04em" }}>
            Est. club &middot; Play loud, think louder
          </span>
        </div>
      </div>

      <div className="rst-scroll" style={{ maxHeight: 640, overflowY: "auto" }}>
        {/* Owner profile */}
        <div style={{ padding: "20px 20px 16px", display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "9999px",
            flexShrink: 0, fontWeight: 600, width: 48, height: 48,
            background: "linear-gradient(145deg, #D6455F, #8B3A5A)", fontSize: 17,
            fontFamily: "'Bebas Neue', sans-serif", letterSpacing: "0.02em",
          }}>
            RK
          </div>
          <div style={{ minWidth: 0 }}>
            <p style={{ fontWeight: 600, margin: 0, fontSize: 15, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              Rehan Khurana
            </p>
            <p style={{ fontSize: 12, color: "#948FA3", margin: "2px 0 0" }}>Founder &amp; Club Captain</p>
          </div>
          <span style={{
            marginLeft: "auto", fontSize: 10, padding: "4px 8px", borderRadius: "9999px", fontWeight: 600,
            flexShrink: 0, background: "rgba(232,181,77,0.14)", color: "#E8B54D",
            fontFamily: "'JetBrains Mono', monospace",
          }}>
            2104
          </span>
        </div>

        {/* Quote */}
        <div style={{ padding: "0 20px 16px" }}>
          <div style={{ borderRadius: 12, padding: "12px 16px", background: "rgba(255,255,255,0.03)", borderLeft: "3px solid #E8B54D" }}>
            <p style={{ fontSize: 13, lineHeight: 1.5, fontStyle: "italic", color: "#EDE9DE", margin: 0 }}>
              &ldquo;{CHESS_QUOTE.text}&rdquo;
            </p>
            <p style={{ fontSize: 11, color: "#948FA3", margin: "6px 0 0" }}>— {CHESS_QUOTE.author}</p>
          </div>
        </div>

        {/* Anthem player */}
        <div style={{ padding: "0 20px 16px" }}>
          <p style={{ margin: "0 0 8px", fontSize: 11, letterSpacing: "0.12em", color: "#948FA3", fontWeight: 600 }}>
            CLUB ANTHEM
          </p>
          <div style={{ borderRadius: 12, padding: 12, background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <button
                onClick={() => setIsPlaying((p) => !p)}
                aria-label={isPlaying ? "Pause anthem" : "Play anthem"}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "9999px",
                  flexShrink: 0, width: 36, height: 36, background: "#E8B54D", color: "#1A1420",
                  border: "none", cursor: "pointer",
                }}
              >
                {isPlaying ? <Pause size={16} fill="#1A1420" /> : <Play size={16} fill="#1A1420" style={{ marginLeft: 2 }} />}
              </button>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 20 }}>
                  {Array.from({ length: 22 }).map((_, i) => {
                    const h = 6 + ((i * 37) % 14);
                    return (
                      <div key={i} className="rst-bar" style={{
                        width: 2.5, height: h, borderRadius: 2,
                        background: i / 22 <= progress / 100 ? "#D6455F" : "rgba(255,255,255,0.14)",
                        animationPlayState: isPlaying ? "running" : "paused",
                        animationDelay: `${i * 0.05}s`,
                      }} />
                    );
                  })}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                  <span style={{ fontSize: 10, color: "#948FA3", fontFamily: "'JetBrains Mono', monospace" }}>{fmt(currentSeconds)}</span>
                  <span style={{ fontSize: 10, color: "#948FA3", fontFamily: "'JetBrains Mono', monospace" }}>{fmt(totalSeconds)}</span>
                </div>
              </div>
              <Volume2 size={15} color="#948FA3" style={{ flexShrink: 0 }} />
            </div>
            <p style={{ fontSize: 11.5, color: "#CFC9DE", marginTop: 10, fontStyle: "italic", lineHeight: 1.5, minHeight: 32 }}>
              {ANTHEM_LINES[activeLineIndex]}
            </p>
          </div>
        </div>

        {/* Recently joined */}
        <div style={{ padding: "0 20px 16px" }}>
          <p style={{ margin: "0 0 8px", fontSize: 11, letterSpacing: "0.12em", color: "#948FA3", fontWeight: 600 }}>
            NEW RECRUITS
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {MOCK_RECENT_MEMBERS.map((m, i) => (
              <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, borderRadius: 8, padding: "8px 12px", background: "rgba(255,255,255,0.03)" }}>
                <RankBadge rank={i + 1} />
                <div style={{ minWidth: 0, flex: 1 }}>
                  <p style={{ margin: 0, fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.name}</p>
                  <p style={{ margin: 0, fontSize: 10.5, color: "#948FA3" }}>joined {m.joinedDaysAgo}d ago</p>
                </div>
                <span style={{ fontSize: 12.5, fontFamily: "'JetBrains Mono', monospace", color: "#E8B54D", fontWeight: 600 }}>
                  {m.rating}
                </span>
              </div>
            ))}
          </div>
        </div>

        {/* Action buttons */}
        <div style={{ padding: "0 20px 16px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <button style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6, borderRadius: 8,
            padding: "10px 0", fontWeight: 600, background: "linear-gradient(135deg, #D6455F, #A6395A)",
            fontSize: 12.5, color: "#F3EFE6", border: "none", cursor: "pointer",
          }}>
            <CalendarDays size={14} /> Join Events
          </button>
          <button style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6, borderRadius: 8,
            padding: "10px 0", fontWeight: 600, background: "rgba(255,255,255,0.06)",
            border: "1px solid rgba(255,255,255,0.12)", fontSize: 12.5, color: "#F3EFE6", cursor: "pointer",
          }}>
            <Trophy size={14} color="#E8B54D" /> Leaderboard
          </button>
        </div>

        {/* Report box */}
        <div style={{ padding: "0 20px 20px" }}>
          <div style={{ borderRadius: 12, padding: 12, background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)" }}>
            <p style={{ fontSize: 11.5, color: "#948FA3", margin: "0 0 6px", fontWeight: 500 }}>
              Report an issue to the club owner
            </p>
            <textarea
              value={report}
              onChange={(e) => setReport(e.target.value)}
              placeholder="Something off with a match, a rating, or a member? Tell us..."
              rows={2}
              style={{
                width: "100%", resize: "none", outline: "none",
                background: "rgba(0,0,0,0.25)", border: "1px solid rgba(255,255,255,0.08)",
                borderRadius: 8, padding: "8px 10px", fontSize: 12, color: "#F3EFE6",
                fontFamily: "'Inter', sans-serif",
              }}
            />
            <button
              onClick={handleReportSubmit}
              style={{
                width: "100%", marginTop: 8, display: "flex", alignItems: "center", justifyContent: "center",
                gap: 6, borderRadius: 8, padding: "8px 0", fontWeight: 600, fontSize: 12.5,
                border: "none", cursor: "pointer", transition: "all 0.2s ease",
                background: sendError ? "rgba(214,69,95,0.18)" : sent ? "rgba(232,181,77,0.18)" : "#E8B54D",
                color: sendError ? "#D6455F" : sent ? "#E8B54D" : "#1A1420",
              }}
            >
              {sendError ? (<><AlertCircle size={14} /> Couldn't send, try again</>)
                : sent ? (<><CheckCircle2 size={14} /> Report sent</>)
                : (<><Send size={13} /> Send report</>)}
            </button>

            <button
              onClick={toggleReports}
              style={{
                width: "100%", marginTop: 8, display: "flex", alignItems: "center", justifyContent: "center",
                gap: 6, padding: "6px 0", background: "transparent", color: "#948FA3", fontSize: 11,
                fontWeight: 500, border: "none", cursor: "pointer",
              }}
            >
              <Inbox size={12} />
              {showReports ? "Hide past reports" : "View past reports"}
              <ChevronDown size={12} style={{ transform: showReports ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s ease" }} />
            </button>

            {showReports && (
              <div style={{ marginTop: 8, paddingTop: 8, display: "flex", flexDirection: "column", gap: 8, borderTop: "1px solid rgba(255,255,255,0.06)", maxHeight: 180, overflowY: "auto" }}>
                {loadingReports ? (
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "12px 0", color: "#948FA3", fontSize: 11.5 }}>
                    <Loader2 size={13} className="rst-spin" /> Loading reports…
                  </div>
                ) : loadError ? (
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "12px 0", color: "#D6455F", fontSize: 11.5 }}>
                    <AlertCircle size={13} /> Couldn't load reports
                  </div>
                ) : reports.length === 0 ? (
                  <p style={{ textAlign: "center", padding: "12px 0", color: "#948FA3", fontSize: 11.5, margin: 0 }}>
                    No reports yet.
                  </p>
                ) : (
                  reports.map((r) => (
                    <div key={r.timestamp} style={{ borderRadius: 8, padding: "8px 12px", background: "rgba(0,0,0,0.25)" }}>
                      <p style={{ fontSize: 12, color: "#EDE9DE", lineHeight: 1.45, margin: 0 }}>{r.text}</p>
                      <p style={{ fontSize: 10, color: "#948FA3", marginTop: 4 }}>{formatTimestamp(r.timestamp)}</p>
                    </div>
                  ))
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RockingSuperstarSidebar />);
</script>
</body>
</html>
