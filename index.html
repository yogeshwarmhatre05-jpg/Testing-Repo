<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginal — AI Chat</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="new-chat" id="newChatBtn">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2V13M2 7.5H13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>New chat</span>
      </button>
    </div>

    <nav class="chat-list" id="chatList" aria-label="Conversation history"></nav>

    <div class="sidebar-bottom">
      <button class="sidebar-action" id="settingsBtn">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 9.5A2 2 0 1 0 7.5 5.5A2 2 0 1 0 7.5 9.5Z" stroke="currentColor" stroke-width="1.2"/><path d="M7.5 1.5V2.7M7.5 12.3V13.5M13.5 7.5H12.3M2.7 7.5H1.5M11.6 3.4L10.8 4.2M4.2 10.8L3.4 11.6M11.6 11.6L10.8 10.8M4.2 4.2L3.4 3.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M7 3V15" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <div class="model-tag" id="modelTag">
        <span class="dot" id="statusDot"></span>
        <span id="modelName">demo-model</span>
      </div>
      <div class="topbar-spacer"></div>
    </header>

    <section class="thread" id="thread">
      <div class="empty-state" id="emptyState">
        <p class="eyebrow">Marginal</p>
        <h1>What are we working through<span class="cursor" aria-hidden="true"></span></h1>
        <div class="chips" id="chips">
          <button class="chip" data-prompt="Explain this error message to me">Explain an error</button>
          <button class="chip" data-prompt="Help me write a function that debounces input">Write a function</button>
          <button class="chip" data-prompt="Give me a second opinion on an approach I'm taking">Get a second opinion</button>
          <button class="chip" data-prompt="Summarize a block of text I'll paste in">Summarize text</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composerForm">
        <textarea
          id="composerInput"
          class="composer-input"
          placeholder="Message Marginal…"
          rows="1"
          aria-label="Message input"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 12.5V2.5M7.5 2.5L3 7M7.5 2.5L12 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="disclaimer">Responses are simulated in demo mode. Marginal can be wrong — verify anything important.</p>
    </div>
  </main>
</div>

<!-- Settings panel -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
    <div class="modal-head">
      <h2 id="settingsTitle">Settings</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close settings">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 3L12 12M12 3L3 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <label class="field">
        <span class="field-label">Mode</span>
        <select id="modeSelect">
          <option value="demo">Demo (simulated replies, no network)</option>
          <option value="live">Live (call your own API endpoint)</option>
        </select>
      </label>

      <div id="liveFields" class="live-fields hidden">
        <label class="field">
          <span class="field-label">API endpoint</span>
          <input id="endpointInput" type="text" placeholder="https://api.openai.com/v1/chat/completions" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">API key</span>
          <input id="apiKeyInput" type="password" placeholder="sk-…" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">Model</span>
          <input id="modelInput" type="text" placeholder="gpt-4o-mini" autocomplete="off">
        </label>
        <p class="field-note">Stored only in this browser's localStorage and sent directly from your browser to the endpoint above. Nothing passes through a server.</p>
      </div>

      <label class="field">
        <span class="field-label">Your display name</span>
        <input id="userNameInput" type="text" placeholder="You" autocomplete="off">
      </label>
    </div>

    <div class="modal-foot">
      <button class="btn-ghost" id="clearAllBtn">Clear all chats</button>
      <button class="btn-primary" id="saveSettingsBtn">Save</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
