<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginal — AI Chat</title>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #12141a;
  --panel: #191c23;
  --panel-hi: #20242c;
  --line: #2a2e38;
  --line-soft: #22252d;
  --text-hi: #ece8e0;
  --text-lo: #9095a1;
  --text-faint: #5c616e;
  --accent: #c9a227;
  --accent-dim: #8a7326;
  --accent-ink: #14140f;
  --user-bg: #232830;
  --danger: #c25b4a;

  --font-display: 'Fraunces', Georgia, serif;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;

  --sidebar-w: 264px;
  --radius: 10px;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--text-hi);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font-family: inherit;
  color: inherit;
}

::selection {
  background: var(--accent-dim);
  color: var(--text-hi);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* APP */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  height: 100dvh;
  transition: grid-template-columns 0.2s ease;
}

.app.sidebar-collapsed {
  grid-template-columns: 0 1fr;
}

/* SIDEBAR */

.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.sidebar-top {
  padding: 14px 12px 8px;
}

.new-chat {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-hi);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.new-chat:hover {
  border-color: var(--accent-dim);
  background: var(--panel-hi);
}

.new-chat svg {
  color: var(--accent);
  flex-shrink: 0;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-lo);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid transparent;
}

.chat-item:hover {
  background: var(--panel-hi);
  color: var(--text-hi);
}

.chat-item.active {
  background: var(--panel-hi);
  color: var(--text-hi);
  border-color: var(--line);
}

.chat-item .title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-item .del {
  opacity: 0;
  flex-shrink: 0;
  color: var(--text-faint);
  padding: 2px;
  border-radius: 4px;
}

.chat-item:hover .del {
  opacity: 1;
}

.chat-item .del:hover {
  color: var(--danger);
}

.empty-list-hint {
  padding: 16px 10px;
  color: var(--text-faint);
  font-size: 12.5px;
  line-height: 1.5;
}

.sidebar-bottom {
  padding: 8px 12px 14px;
  border-top: 1px solid var(--line-soft);
}

.sidebar-action {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--text-lo);
  font-size: 13px;
  cursor: pointer;
}

.sidebar-action:hover {
  background: var(--panel-hi);
  color: var(--text-hi);
}

/* MAIN */

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-soft);
  flex-shrink: 0;
}

.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  background: transparent;
  border: none;
  border-radius: 7px;
  color: var(--text-lo);
  cursor: pointer;
}

.icon-btn:hover {
  background: var(--panel-hi);
  color: var(--text-hi);
}

.model-tag {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-lo);
  border: 1px solid var(--line);
  padding: 5px 10px;
  border-radius: 20px;
}

.model-tag .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-faint);
}

.model-tag .dot.live {
  background: #6ea86a;
}

.topbar-spacer {
  flex: 1;
}

/* THREAD */

.thread {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.empty-state {
  margin: auto;
  text-align: center;
  padding: 24px;
  max-width: 560px;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 14px;
}

.empty-state h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 32px;
  line-height: 1.25;
  color: var(--text-hi);
  margin: 0 0 30px;
}

.cursor {
  display: inline-block;
  width: 3px;
  height: 0.9em;
  background: var(--accent);
  margin-left: 4px;
  vertical-align: -0.12em;
  animation: blink 1.1s step-end infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.chip {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text-lo);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}

.chip:hover {
  border-color: var(--accent-dim);
  color: var(--text-hi);
}

/* MESSAGES */

.messages {
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 12px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.msg {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.msg-avatar {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  margin-top: 2px;
}

.msg.user .msg-avatar {
  background: var(--user-bg);
  color: var(--text-lo);
}

.msg.assistant .msg-avatar {
  background: var(--accent);
  color: var(--accent-ink);
}

.msg-body {
  min-width: 0;
  flex: 1;
  padding-top: 2px;
}

.msg-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-faint);
  margin: 0 0 4px;
}

.msg-text {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--text-hi);
  white-space: pre-wrap;
  word-wrap: break-word;
}

.msg-text code {
  font-family: var(--font-mono);
  background: var(--panel-hi);
  border: 1px solid var(--line);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 0.9em;
}

.msg-text pre {
  background: var(--panel-hi);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  overflow-x: auto;
  margin: 8px 0;
}

.msg-text pre code {
  background: none;
  border: none;
  padding: 0;
}

.typing-dots {
  display: inline-flex;
  gap: 3px;
  padding: 4px 0;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: dot-pulse 1.2s ease-in-out infinite;
}

.typing-dots span:nth-child(2) {
  animation-delay: 0.15s;
}

.typing-dots span:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes dot-pulse {
  0%, 60%, 100% {
    opacity: 0.25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-2px);
  }
}

/* COMPOSER */

.composer-wrap {
  flex-shrink: 0;
  padding: 10px 20px 16px;
}

.composer {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 8px 8px 16px;
  transition: border-color 0.15s ease;
}

.composer:focus-within {
  border-color: var(--accent-dim);
}

.composer-input {
  flex: 1;
  background: transparent;
  border: none;
  resize: none;
  color: var(--text-hi);
  font-size: 14.5px;
  line-height: 1.5;
  max-height: 200px;
  padding: 7px 0;
}

.composer-input:focus {
  outline: none;
}

.composer-input::placeholder {
  color: var(--text-faint);
}

.send-btn {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  border: none;
  background: var(--accent);
  color: var(--accent-ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 0.15s ease, transform 0.1s ease;
}

.send-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.send-btn:disabled {
  background: var(--line);
  color: var(--text-faint);
  cursor: default;
}

.disclaimer {
  text-align: center;
  font-size: 11.5px;
  color: var(--text-faint);
  margin: 10px 0 0;
}/* SETTINGS MODAL */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10, 11, 14, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  width: 100%;
  max-width: 420px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line-soft);
}

.modal-head h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 18px;
  margin: 0;
}

.modal-body {
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 12.5px;
  color: var(--text-lo);
  font-weight: 500;
}

.field input,
.field select {
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 13.5px;
  color: var(--text-hi);
}

.field input:focus,
.field select:focus {
  outline: none;
  border-color: var(--accent-dim);
}

.field-note {
  font-size: 11.5px;
  color: var(--text-faint);
  line-height: 1.5;
  margin: 0;
}

.live-fields {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.hidden {
  display: none;
}

.modal-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-top: 1px solid var(--line-soft);
}

.btn-ghost,
.btn-primary {
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

.btn-ghost {
  background: transparent;
  color: var(--danger);
}

.btn-ghost:hover {
  background: rgba(194, 91, 74, 0.1);
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
}

.btn-primary:hover {
  opacity: 0.9;
}

/* RESPONSIVE */

@media (max-width: 780px) {

  .app {
    grid-template-columns: 0 1fr;
  }

  .app.sidebar-open {
    grid-template-columns: 240px 1fr;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 240px;
    z-index: 40;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }

  .app.sidebar-open .sidebar {
    transform: translateX(0);
  }

  .empty-state h1 {
    font-size: 25px;
  }

  .composer-wrap {
    padding-left: 10px;
    padding-right: 10px;
  }

  .messages {
    padding-left: 14px;
    padding-right: 14px;
  }
}
</style>

</head>

<body>

<div class="app" id="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

      <button class="new-chat" id="newChatBtn">

        <svg
          width="15"
          height="15"
          viewBox="0 0 15 15"
          fill="none">

          <path
            d="M7.5 2V13M2 7.5H13"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"/>

        </svg>

        <span>New chat</span>

      </button>

    </div>


    <nav
      class="chat-list"
      id="chatList"
      aria-label="Conversation history">
    </nav>


    <div class="sidebar-bottom">

      <button
        class="sidebar-action"
        id="settingsBtn">

        <svg
          width="15"
          height="15"
          viewBox="0 0 15 15"
          fill="none">

          <path
            d="M7.5 9.5A2 2 0 1 0 7.5 5.5A2 2 0 1 0 7.5 9.5Z"
            stroke="currentColor"
            stroke-width="1.2"/>

          <path
            d="M7.5 1.5V2.7M7.5 12.3V13.5M13.5 7.5H12.3M2.7 7.5H1.5M11.6 3.4L10.8 4.2M4.2 10.8L3.4 11.6M11.6 11.6L10.8 10.8M4.2 4.2L3.4 3.4"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"/>

        </svg>

        <span>Settings</span>

      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="icon-btn"
        id="sidebarToggle"
        aria-label="Toggle sidebar">

        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none">

          <rect
            x="2"
            y="3"
            width="14"
            height="12"
            rx="2"
            stroke="currentColor"
            stroke-width="1.3"/>

          <path
            d="M7 3V15"
            stroke="currentColor"
            stroke-width="1.3"/>

        </svg>

      </button>


      <div class="model-tag" id="modelTag">

        <span
          class="dot"
          id="statusDot">
        </span>

        <span id="modelName">
          demo-model
        </span>

      </div>


      <div class="topbar-spacer"></div>

    </header>


    <section
      class="thread"
      id="thread">

      <div
        class="empty-state"
        id="emptyState">

        <p class="eyebrow">
          Marginal
        </p>


        <h1>
          What are we working through<span
            class="cursor"
            aria-hidden="true"></span>
        </h1>


        <div
          class="chips"
          id="chips">

          <button
            class="chip"
            data-prompt="Explain this error message to me">
            Explain an error
          </button>


          <button
            class="chip"
            data-prompt="Help me write a function that debounces input">
            Write a function
          </button>


          <button
            class="chip"
            data-prompt="Give me a second opinion on an approach I'm taking">
            Get a second opinion
          </button>


          <button
            class="chip"
            data-prompt="Summarize a block of text I'll paste in">
            Summarize text
          </button>

        </div>

      </div>


      <div
        class="messages"
        id="messages">
      </div>

    </section>


    <!-- COMPOSER -->

    <div class="composer-wrap">

      <form
        class="composer"
        id="composerForm">

        <textarea
          id="composerInput"
          class="composer-input"
          placeholder="Message Marginal…"
          rows="1"
          aria-label="Message input"></textarea>


        <button
          type="submit"
          class="send-btn"
          id="sendBtn"
          aria-label="Send message"
          disabled>

          <svg
            width="15"
            height="15"
            viewBox="0 0 15 15"
            fill="none">

            <path
              d="M7.5 12.5V2.5M7.5 2.5L3 7M7.5 2.5L12 7"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"/>

          </svg>

        </button>

      </form>


      <p class="disclaimer">
        Responses are simulated in demo mode.
        Marginal can be wrong — verify anything important.
      </p>

    </div>

  </main>

</div>


<!-- SETTINGS PANEL -->

<div
  class="modal-backdrop"
  id="modalBackdrop">

  <div
    class="modal"
    role="dialog"
    aria-labelledby="settingsTitle"
    aria-modal="true">

    <div class="modal-head">

      <h2 id="settingsTitle">
        Settings
      </h2>


      <button
        class="icon-btn"
        id="closeSettings"
        aria-label="Close settings">

        <svg
          width="15"
          height="15"
          viewBox="0 0 15 15"
          fill="none">

          <path
            d="M3 3L12 12M12 3L3 12"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"/>

        </svg>

      </button>

    </div>


    <div class="modal-body">

      <label class="field">

        <span class="field-label">
          Mode
        </span>


        <select id="modeSelect">

          <option value="demo">
            Demo (simulated replies, no network)
          </option>

          <option value="live">
            Live (call your own API endpoint)
          </option>

        </select>

      </label>


      <div
        id="liveFields"
        class="live-fields hidden">

        <label class="field">

          <span class="field-label">
            API endpoint
          </span>


          <input
            id="endpointInput"
            type="text"
            placeholder="https://api.openai.com/v1/chat/completions"
            autocomplete="off">

        </label>


        <label class="field">

          <span class="field-label">
            API key
          </span>


          <input
            id="apiKeyInput"
            type="password"
            placeholder="sk-…"
            autocomplete="off">

        </label>


        <label class="field">

          <span class="field-label">
            Model
          </span>


          <input
            id="modelInput"
            type="text"
            placeholder="gpt-4o-mini"
            autocomplete="off">

        </label>


        <p class="field-note">
          Stored only in this browser's localStorage
          and sent directly from your browser to
          the endpoint above. Nothing passes through
          a server.
        </p>

      </div>


      <label class="field">

        <span class="field-label">
          Your display name
        </span>


        <input
          id="userNameInput"
          type="text"
          placeholder="You"
          autocomplete="off">

      </label>

    </div>


    <div class="modal-foot">

      <button
        class="btn-ghost"
        id="clearAllBtn">
        Clear all chats
      </button>


      <button
        class="btn-primary"
        id="saveSettingsBtn">
        Save
      </button>

    </div>

  </div>

</div>


<script>
(() => {
  'use strict';

  const STORAGE_KEY =
    'marginal.chats.v1';

  const SETTINGS_KEY =
    'marginal.settings.v1';

  const defaultSettings = {
    mode: 'demo',
    endpoint: '',
    apiKey: '',
    model: 'gpt-4o-mini',
    userName: 'You'
  };

  let settings = {
    ...defaultSettings,
    ...loadJSON(SETTINGS_KEY, {})
  };

  let chats =
    loadJSON(STORAGE_KEY, []);

  let activeChatId =
    chats[0]?.id ?? null;

  let isGenerating = false;


  function loadJSON(key, fallback) {

    try {

      const raw =
        localStorage.getItem(key);

      return raw
        ? JSON.parse(raw)
        : fallback;

    } catch {

      return fallback;

    }

  }


  function persistChats() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(chats)
    );

  }


  function persistSettings() {

    localStorage.setItem(
      SETTINGS_KEY,
      JSON.stringify(settings)
    );

  }


  const $ = (selector) =>
    document.querySelector(selector);


  const app =
    $('#app');

  const sidebar =
    $('#sidebar');

  const sidebarToggle =
    $('#sidebarToggle');

  const chatList =
    $('#chatList');

  const newChatBtn =
    $('#newChatBtn');

  const thread =
    $('#thread');

  const emptyState =
    $('#emptyState');

  const messagesEl =
    $('#messages');

  const chips =
    $('#chips');

  const composerForm =
    $('#composerForm');

  const composerInput =
    $('#composerInput');

  const sendBtn =
    $('#sendBtn');

  const modelName =
    $('#modelName');

  const statusDot =
    $('#statusDot');

  const settingsBtn =
    $('#settingsBtn');

  const modalBackdrop =
    $('#modalBackdrop');

  const closeSettings =
    $('#closeSettings');

  const saveSettingsBtn =
    $('#saveSettingsBtn');

  const clearAllBtn =
    $('#clearAllBtn');

  const modeSelect =
    $('#modeSelect');

  const liveFields =
    $('#liveFields');

  const endpointInput =
    $('#endpointInput');

  const apiKeyInput =
    $('#apiKeyInput');

  const modelInput =
    $('#modelInput');

  const userNameInput =
    $('#userNameInput');


  function init() {

    renderChatList();

    renderThread();

    updateModelTag();

    bindEvents();

    autoGrow();

  }


  function bindEvents() {

    newChatBtn.addEventListener(
      'click',
      createNewChat
    );

    sidebarToggle.addEventListener(
      'click',
      toggleSidebar
    );

    composerForm.addEventListener(
      'submit',
      onSubmit
    );

    composerInput.addEventListener(
      'input',
      () => {

        autoGrow();

        sendBtn.disabled =
          !composerInput.value.trim() ||
          isGenerating;

      }
    );

    composerInput.addEventListener(
      'keydown',
      (e) => {

        if (
          e.key === 'Enter' &&
          !e.shiftKey
        ) {

          e.preventDefault();

          composerForm.requestSubmit();

        }

      }
    );

    chips.addEventListener(
      'click',
      (e) => {

        const btn =
          e.target.closest('.chip');

        if (!btn) return;

        composerInput.value =
          btn.dataset.prompt;

        sendBtn.disabled = false;

        composerForm.requestSubmit();

      }
    );

    settingsBtn.addEventListener(
      'click',
      openSettings
    );

    closeSettings.addEventListener(
      'click',
      closeSettingsModal
    );

    modalBackdrop.addEventListener(
      'click',
      (e) => {

        if (e.target === modalBackdrop) {

          closeSettingsModal();

        }

      }
    );

    modeSelect.addEventListener(
      'change',
      () => {

        liveFields.classList.toggle(
          'hidden',
          modeSelect.value !== 'live'
        );

      }
    );

    saveSettingsBtn.addEventListener(
      'click',
      saveSettings
    );

    clearAllBtn.addEventListener(
      'click',
      clearAllChats
    );

  }


  function toggleSidebar() {

    const isMobile =
      window.innerWidth <= 780;

    if (isMobile) {

      app.classList.toggle(
        'sidebar-open'
      );

    } else {

      app.classList.toggle(
        'sidebar-collapsed'
      );

    }

  }


  function renderChatList() {

    chatList.innerHTML = '';

    if (chats.length === 0) {

      const hint =
        document.createElement('p');

      hint.className =
        'empty-list-hint';

      hint.textContent =
        'Your conversations will appear here.';

      chatList.appendChild(hint);

      return;

    }

    chats.forEach((chat) => {

      const item =
        document.createElement('div');

      item.className =
        'chat-item' +
        (
          chat.id === activeChatId
            ? ' active'
            : ''
        );

      item.setAttribute(
        'role',
        'button'
      );

      item.tabIndex = 0;


      const title =
        document.createElement('span');

      title.className = 'title';

      title.textContent =
        chat.title || 'New chat';


      const del =
        document.createElement('span');

      del.className = 'del';

      del.innerHTML = `
        <svg width="13" height="13"
             viewBox="0 0 15 15"
             fill="none">

          <path
            d="M3 4H12M6 4V2.5H9V4M4.5 4V12.5H10.5V4"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"/>

        </svg>
      `;


      del.addEventListener(
        'click',
        (e) => {

          e.stopPropagation();

          deleteChat(chat.id);

        }
      );


      item.appendChild(title);

      item.appendChild(del);


      item.addEventListener(
        'click',
        () => switchChat(chat.id)
      );


      chatList.appendChild(item);

    });

  }  function createNewChat() {
    const chat = {
      id: crypto.randomUUID(),
      title: '',
      messages: [],
      createdAt: Date.now()
    };

    chats.unshift(chat);
    activeChatId = chat.id;

    persistChats();
    renderChatList();
    renderThread();

    if (window.innerWidth <= 780) {
      app.classList.remove('sidebar-open');
    }

    composerInput.focus();
  }


  function switchChat(id) {
    activeChatId = id;

    renderChatList();
    renderThread();

    if (window.innerWidth <= 780) {
      app.classList.remove('sidebar-open');
    }
  }


  function deleteChat(id) {
    chats = chats.filter(
      (chat) => chat.id !== id
    );

    if (activeChatId === id) {
      activeChatId =
        chats[0]?.id ?? null;
    }

    persistChats();
    renderChatList();
    renderThread();
  }


  function clearAllChats() {
    if (
      !confirm(
        'Delete all conversations? This cannot be undone.'
      )
    ) {
      return;
    }

    chats = [];
    activeChatId = null;

    persistChats();
    renderChatList();
    renderThread();

    closeSettingsModal();
  }


  function getActiveChat() {
    return (
      chats.find(
        (chat) =>
          chat.id === activeChatId
      ) || null
    );
  }


  function renderThread() {
    const chat = getActiveChat();

    messagesEl.innerHTML = '';

    if (
      !chat ||
      chat.messages.length === 0
    ) {
      emptyState.style.display = 'flex';
      messagesEl.style.display = 'none';
      return;
    }

    emptyState.style.display = 'none';
    messagesEl.style.display = 'flex';

    chat.messages.forEach((msg) => {
      appendMessageEl(
        msg.role,
        msg.content
      );
    });

    thread.scrollTop =
      thread.scrollHeight;
  }


  function appendMessageEl(
    role,
    content
  ) {
    const wrap =
      document.createElement('div');

    wrap.className =
      `msg ${role}`;


    const avatar =
      document.createElement('div');

    avatar.className =
      'msg-avatar';

    avatar.textContent =
      role === 'user'
        ? (
            settings.userName ||
            'You'
          )
            .slice(0, 1)
            .toUpperCase()
        : 'M';


    const body =
      document.createElement('div');

    body.className =
      'msg-body';


    const name =
      document.createElement('p');

    name.className =
      'msg-name';

    name.textContent =
      role === 'user'
        ? settings.userName || 'You'
        : 'Marginal';


    const text =
      document.createElement('div');

    text.className =
      'msg-text';

    text.innerHTML =
      formatContent(content);


    body.appendChild(name);
    body.appendChild(text);

    wrap.appendChild(avatar);
    wrap.appendChild(body);

    messagesEl.appendChild(wrap);

    return text;
  }


  function formatContent(raw) {

    const escaped =
      String(raw)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');


    const withBlocks =
      escaped.replace(
        /```([\s\S]*?)```/g,
        (_, code) => {

          return `
            <pre><code>
${code.trim()}
            </code></pre>
          `;

        }
      );


    return withBlocks.replace(
      /`([^`]+)`/g,
      '<code>$1</code>'
    );
  }


  function autoGrow() {

    composerInput.style.height =
      'auto';

    composerInput.style.height =
      Math.min(
        composerInput.scrollHeight,
        200
      ) + 'px';
  }


  function onSubmit(e) {

    e.preventDefault();

    const value =
      composerInput.value.trim();

    if (
      !value ||
      isGenerating
    ) {
      return;
    }


    let chat =
      getActiveChat();


    if (!chat) {

      chat = {
        id: crypto.randomUUID(),
        title: '',
        messages: [],
        createdAt: Date.now()
      };

      chats.unshift(chat);
      activeChatId = chat.id;
    }


    if (!chat.title) {

      chat.title =
        value.slice(0, 42) +
        (
          value.length > 42
            ? '…'
            : ''
        );
    }


    chat.messages.push({
      role: 'user',
      content: value
    });


    persistChats();
    renderChatList();
    renderThread();


    composerInput.value = '';

    autoGrow();

    sendBtn.disabled = true;


    generateReply(chat);
  }


  async function generateReply(chat) {

    isGenerating = true;

    emptyState.style.display =
      'none';

    messagesEl.style.display =
      'flex';


    const wrap =
      document.createElement('div');

    wrap.className =
      'msg assistant';


    wrap.innerHTML = `
      <div class="msg-avatar">M</div>

      <div class="msg-body">

        <p class="msg-name">
          Marginal
        </p>

        <div class="msg-text">

          <span class="typing-dots">

            <span></span>
            <span></span>
            <span></span>

          </span>

        </div>

      </div>
    `;


    messagesEl.appendChild(wrap);

    thread.scrollTop =
      thread.scrollHeight;


    const textEl =
      wrap.querySelector(
        '.msg-text'
      );


    try {

      let reply;


      if (
        settings.mode === 'live' &&
        settings.endpoint &&
        settings.apiKey
      ) {

        reply =
          await callLiveApi(chat);

      } else {

        reply =
          mockReply(
            chat.messages[
              chat.messages.length - 1
            ].content,
            chat.messages.length
          );

      }


      await streamInto(
        textEl,
        reply
      );


      chat.messages.push({
        role: 'assistant',
        content: reply
      });


    } catch (err) {

      const msg =
        `Something went wrong reaching the API: ${err.message}. Check your endpoint and key in Settings, or switch back to Demo mode.`;


      textEl.innerHTML =
        formatContent(msg);


      chat.messages.push({
        role: 'assistant',
        content: msg
      });

    }


    persistChats();

    isGenerating = false;

    sendBtn.disabled =
      !composerInput.value.trim();
  }


  async function streamInto(
    el,
    fullText
  ) {

    el.innerHTML = '';

    const words =
      fullText.split(/(\s+)/);

    let acc = '';


    for (
      let i = 0;
      i < words.length;
      i++
    ) {

      acc += words[i];

      el.innerHTML =
        formatContent(acc);

      thread.scrollTop =
        thread.scrollHeight;

      await sleep(
        8 + Math.random() * 18
      );
    }
  }


  function sleep(ms) {

    return new Promise(
      (resolve) =>
        setTimeout(resolve, ms)
    );
  }


  function mockReply(
    userText,
    turnCount
  ) {

    const t =
      userText.toLowerCase();


    if (
      /^(hi|hello|hey)\b/.test(t)
    ) {

      return `
Hey there. What are you working on?
I can help with code, writing, studying,
or thinking through a problem.
      `.trim();

    }


    if (
      t.includes('error') ||
      t.includes('bug') ||
      t.includes('debug')
    ) {

      return `
I can't run code in demo mode, but here's how I'd approach it:

1. Reproduce the error in isolation.
2. Read the error from the bottom up.
3. Check the values immediately before the failure.
4. Compare what the code expects with what it actually receives.

Paste the actual error and the relevant code and I can help you analyze it.

For real AI responses, switch to Live mode in Settings.
      `.trim();

    }


    if (
      t.includes('function') ||
      t.includes('debounce') ||
      t.includes('code')
    ) {

      return `
Here's a simple debounce function:

\`\`\`js
function debounce(fn, delay = 300) {
  let timer;

  return (...args) => {
    clearTimeout(timer);

    timer = setTimeout(() => {
      fn(...args);
    }, delay);
  };
}
\`\`\`

This is a demo response. Connect a real API in Settings for actual generated code.
      `.trim();

    }


    if (
      t.includes('summar')
    ) {

      return `
Paste the text you'd like summarized.

In Demo mode I only provide simulated responses.
Switch to Live mode in Settings to connect a real model.
      `.trim();

    }


    if (
      t.includes('opinion') ||
      t.includes('think')
    ) {

      return `
Lay out the approach you're considering and the constraints you're working with.

I can then help compare the trade-offs.

This is currently Demo mode, so connect an API for real model responses.
      `.trim();

    }


    const generic = [

      "That's a reasonable place to start. Tell me a little more about what you're trying to achieve.",

      "Got it. This is currently running in Demo mode, so this response is simulated.",

      "Tell me more about the problem and I'll help break it down."
    ];


    return generic[
      turnCount % generic.length
    ];
  }


  async function callLiveApi(chat) {

    const payload = {

      model:
        settings.model ||
        'gpt-4o-mini',

      messages:
        chat.messages.map(
          (m) => ({
            role: m.role,
            content: m.content
          })
        ),

      stream: false
    };


    const res =
      await fetch(
        settings.endpoint,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json',

            'Authorization':
              `Bearer ${settings.apiKey}`
          },

          body:
            JSON.stringify(payload)
        }
      );


    if (!res.ok) {

      const body =
        await res.text()
          .catch(() => '');

      throw new Error(
        `HTTP ${res.status} ${body.slice(0, 200)}`
      );
    }


    const data =
      await res.json();


    const content =
      data?.choices?.[0]?.message?.content ??
      data?.content?.[0]?.text ??
      JSON.stringify(data).slice(
        0,
        400
      );


    return content;
  }


  function openSettings() {

    modeSelect.value =
      settings.mode;

    endpointInput.value =
      settings.endpoint;

    apiKeyInput.value =
      settings.apiKey;

    modelInput.value =
      settings.model;

    userNameInput.value =
      settings.userName;


    liveFields.classList.toggle(
      'hidden',
      settings.mode !== 'live'
    );


    modalBackdrop.classList.add(
      'open'
    );
  }


  function closeSettingsModal() {

    modalBackdrop.classList.remove(
      'open'
    );
  }


  function saveSettings() {

    settings = {

      mode:
        modeSelect.value,

      endpoint:
        endpointInput.value.trim(),

      apiKey:
        apiKeyInput.value.trim(),

      model:
        modelInput.value.trim() ||
        'gpt-4o-mini',

      userName:
        userNameInput.value.trim() ||
        'You'
    };


    persistSettings();

    updateModelTag();

    renderThread();

    closeSettingsModal();
  }


  function updateModelTag() {

    const live =
      settings.mode === 'live' &&
      settings.endpoint &&
      settings.apiKey;


    modelName.textContent =
      live
        ? settings.model
        : 'demo-model';


    statusDot.classList.toggle(
      'live',
      !!live
    );
  }


  init();

})();
</script>

</body>
</html>
